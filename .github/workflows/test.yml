name: test

on:
  push:
    branches:
    - master
    - develop
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Clean lib
        run: rm -rf lib
      
      - name: Create .env file
        run: echo "ETH_RPC_URL=${{ secrets.ETH_RPC_URL }}" > .env

      # - name: Run Forge build
      #   run: |
      #     forge --version
      #     forge build --sizes
      #   id: build

      # - name: Run Forge fmt
      #   run: |
      #     forge fmt --check
      #   id: fmt

      - name: Install Foundry deps
        run: forge install

      - name: Install Vyper
        run: pip3 install vyper==0.4.3

      - name: Build flex-contracts artifacts
        run: forge build --root lib/flex-contracts

      - name: Show remappings
        run: forge remappings

      - name: Run Forge tests
        run: |
          forge test -vvv --fork-url ${{ secrets.ETH_RPC_URL }}
        id: test